name: Internship Board Watcher

on:
  schedule:
    - cron: '*/30 * * * *'   # every 30 minutes
  workflow_dispatch:          # lets you trigger it manually to test

permissions:
  contents: write

concurrency:
  group: internship-watcher
  cancel-in-progress: false

jobs:
  check-boards:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Fetch latest versions of both boards
        run: |
          mkdir -p snapshots
          curl -s https://raw.githubusercontent.com/SimplifyJobs/Summer2026-Internships/dev/README.md -o current-main.md
          curl -s https://raw.githubusercontent.com/SimplifyJobs/Summer2026-Internships/dev/README-Off-Season.md -o current-offseason.md

      - name: Parse boards and build email
        id: parse
        run: python3 .github/workflow-scripts/parse_boards.py

      - name: Send email if new rows found
        if: steps.parse.outputs.total != '0'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: ${{ steps.parse.outputs.subject }}
          to: ${{ secrets.MAIL_TO }}
          from: Internship Watcher
          html_body: ${{ steps.parse.outputs.html_body }}
          body: ${{ steps.parse.outputs.plain_body }}

      - name: Save new snapshots for next run
        run: |
          cp current-main.md snapshots/previous-main.md
          cp current-offseason.md snapshots/previous-offseason.md

      - name: Commit updated snapshots
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          # Stage only the files this workflow owns. A bare "git add snapshots/"
          # also picks up ats-seen.json, which the ATS watcher owns — both
          # workflows then commit the same file and collide on rebase.
          git add snapshots/previous-main.md snapshots/previous-offseason.md snapshots/seen.json
          git diff --staged --quiet && exit 0
          git commit -m "Update board snapshots"
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            echo "push attempt $attempt failed; retrying"
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          echo "could not push after 3 attempts"; exit 1
